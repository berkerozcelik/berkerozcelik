name: chemo_care
description: >-
  ChemoCare – Kemoterapi sürecinde tedaviye uyumu artıran dijital asistan.
publish_to: 'none'
version: 0.1.0
environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ^3.22.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hooks_riverpod: ^2.5.1
  firebase_core: ^2.15.1
  firebase_auth: ^4.7.2
  cloud_firestore: ^4.8.4
  firebase_messaging: ^14.7.7
  firebase_storage: ^11.2.7
  flutter_local_notifications: ^17.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.15
  easy_localization: ^3.0.3
  intl: ^0.18.1
  equatable: ^2.0.5
  uuid: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  riverpod_test: ^2.0.5
  mocktail: ^1.0.3
  lints: ^2.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
